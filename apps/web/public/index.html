<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0f">
  <meta name="description" content="LUA-X — AI-native Roblox development studio.">
  <title>LUA-X — Roblox AI Engineering Studio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><div class="brand-mark">X</div><div><strong>LUA-X</strong><span>Roblox engineering</span></div></div>
      <nav><a class="nav-item active" href="#chat"><span>✦</span>Chat</a><a class="nav-item" href="#projects"><span>▦</span>Projects</a><a class="nav-item" href="#history"><span>◷</span>History</a></nav>
      <div class="sidebar-bottom">
        <div class="connection-card studio-card">
          <div class="connection-line"><span class="pulse" id="studio-pulse"></span><span id="studio-label">Studio offline</span></div>
          <small id="studio-detail">Open the LUA-X plugin in Roblox Studio and press Connect</small>
          <button class="ping-button" id="ping-studio" type="button" disabled>◉ Ping Studio</button>
        </div>
        <div class="sidebar-links"><a href="#settings">Settings</a><a href="#docs">Docs</a><a class="download-link" id="download-plugin" href="/LUA-X.plugin.lua" download="LUA-X.plugin.lua">↓ Download Studio plugin</a></div>
      </div>
    </aside>
    <main class="main" id="chat">
      <header class="topbar">
        <div class="breadcrumbs"><span>LUA-X</span><b>/</b><strong>Chat</strong></div>
        <div class="top-actions">
          <span class="status-pill" id="backend-status">Checking…</span>
          <span class="status-pill" id="ai-status">AI —</span>
          <span class="model-label" id="model-label">NVIDIA · not configured</span>
        </div>
      </header>
      <section class="chat-panel">
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="composer">
          <textarea id="prompt" rows="2" placeholder="Ask LUA-X to write Luau, design a system, or solve a Roblox scripting problem…" aria-label="Message LUA-X"></textarea>
          <button class="send-button" id="send-button" type="button"><span class="button-mark">✦</span><span>Send</span></button>
        </div>
        <div class="composer-note" id="composer-note">LUA-X answers with plain text and Luau code. Nothing is pushed to Studio automatically.</div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
